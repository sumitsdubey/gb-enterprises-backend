spring:
  application:
    name: gb-crm

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gb_crm}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-very-long-secret-key-at-least-256-bits}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}          # 24h
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7d

  upload:
    dir: ${UPLOAD_DIR:uploads}

  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  backend-url: https://gb-enterprises-backend.onrender.com

server:
  port: ${PORT:8088}
  servlet:
    context-path: /api/v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
